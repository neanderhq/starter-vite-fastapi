services:
  web:
    build:
      context: ..
      dockerfile: .neander/Dockerfile
    ports: ["8080:8080"]
    secrets: [neander_environment]
    x-google-cloudrun:
      ingress-container: true
secrets:
  neander_environment:
    file: /run/neander/secrets/neander_environment
x-neander:
  ingress:
    service: web
    port: 8080
    root_probe: /
  environment: []
  probes:
    - path: /api/health
      success_status_range: 2xx
